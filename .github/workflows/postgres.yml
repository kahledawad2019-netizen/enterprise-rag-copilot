name: Postgres migration

# Runs the PostgreSQL translation of the schema against a real PostgreSQL
# server on every push, so the migration is verified rather than asserted.
#
# This workflow is the reason the migration is being attempted at all. The
# original advice against moving off SQL Server rested on one fact: the
# translation could not be checked, because the development machine has
# neither Docker nor a local PostgreSQL. A service container removes that
# objection - every translated statement is executed, and the tenant-isolation
# and least-privilege properties are asserted against the running database
# rather than read back off the page.
#
# Scripts are added here as they are translated. A script that is not listed
# has not been verified, and the summary at the end says which.

on:
  push:
    branches: [main, cloud-deploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: Apply and verify schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for an ephemeral container that is destroyed
          # with the runner. Nothing here is a real secret, and nothing here
          # is reachable from outside the job.
          POSTGRES_USER: copilot_ci
          POSTGRES_PASSWORD: copilot_ci
          POSTGRES_DB: enterprisecopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot_ci -d enterprisecopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: copilot_ci
      PGPASSWORD: copilot_ci
      PGDATABASE: enterprisecopilot
      # Fail the whole script on the first error instead of carrying on and
      # reporting success at the end. Without this, a broken statement in the
      # middle of a file is a warning nobody reads.
      PSQL: psql --quiet --no-psqlrc --set=ON_ERROR_STOP=1

    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Server version
        run: $PSQL -c "SELECT version();"

      # Each script is applied separately so a failure names the file rather
      # than a line number in a concatenated stream.
      - name: 001 database preconditions
        run: $PSQL -f local-enterprise-copilot/sql/postgres/001_create_database.sql

      - name: 002 schemas
        run: $PSQL -f local-enterprise-copilot/sql/postgres/002_create_schemas.sql

      - name: 003 tables
        run: $PSQL -f local-enterprise-copilot/sql/postgres/003_create_tables.sql

      # Re-running must be safe. The SQL Server scripts are idempotent by
      # design and the translation has to keep that, or a redeploy becomes a
      # one-shot operation nobody dares repeat. This is also the step that
      # catches a dropped IF OBJECT_ID guard: sqlglot silently discards those,
      # which would pass a first run and fail every one after it.
      - name: Re-apply 001-003 (idempotency)
        run: |
          $PSQL -f local-enterprise-copilot/sql/postgres/001_create_database.sql
          $PSQL -f local-enterprise-copilot/sql/postgres/002_create_schemas.sql
          $PSQL -f local-enterprise-copilot/sql/postgres/003_create_tables.sql

      - name: Assert all 25 tables exist
        run: |
          $PSQL -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              expected text[] := ARRAY[
                  'core.tenants','core.customers','core.customer_contacts',
                  'core.products','core.plans','core.subscriptions',
                  'core.subscription_changes','core.usage_daily',
                  'billing.invoices','billing.invoice_items','billing.payments',
                  'billing.refunds',
                  'support.sla_policies','support.tickets','support.ticket_events',
                  'support.sla_breaches','support.incidents','support.incident_impact',
                  'analytics.customer_health',
                  'ai.business_glossary','ai.approved_sql_examples','ai.audit_events',
                  'ai.schema_version',
                  'security.access_groups','security.app_users'
              ];
              missing text;
              found int;
          BEGIN
              SELECT string_agg(t, ', ')
              INTO missing
              FROM unnest(expected) AS t
              WHERE to_regclass(t) IS NULL;

              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'Missing tables: %', missing;
              END IF;

              SELECT count(*) INTO found
              FROM information_schema.tables
              WHERE table_schema IN ('core','billing','support','analytics','ai','security')
                AND table_type = 'BASE TABLE';

              RAISE NOTICE 'All 25 expected tables present (% base tables total).', found;
          END
          $$;
          SQL

      # The tenant column is what every isolation rule keys on. If the
      # translation dropped it from a table, RLS in 009 would silently protect
      # nothing there.
      - name: Assert tenant_id survived on tenant-scoped tables
        run: |
          $PSQL -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              missing text;
          BEGIN
              SELECT string_agg(t, ', ')
              INTO missing
              FROM unnest(ARRAY[
                  'core.customers','core.subscriptions','core.usage_daily',
                  'billing.invoices','billing.payments','support.tickets'
              ]) AS t
              WHERE NOT EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = split_part(t, '.', 1)
                    AND table_name   = split_part(t, '.', 2)
                    AND column_name  = 'tenant_id'
              );

              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'tenant_id missing on: %', missing;
              END IF;

              RAISE NOTICE 'tenant_id present on every tenant-scoped table checked.';
          END
          $$;
          SQL

      # A CHECK constraint that vanished in translation is a data-integrity
      # rule that stopped existing without anyone noticing.
      - name: Assert CHECK constraints survived
        run: |
          $PSQL -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              n int;
          BEGIN
              SELECT count(*) INTO n
              FROM information_schema.table_constraints
              WHERE constraint_type = 'CHECK'
                AND constraint_schema IN ('core','billing','support','analytics','ai','security')
                AND constraint_name LIKE 'CK\_%';

              IF n < 20 THEN
                  RAISE EXCEPTION
                      'Only % named CHECK constraints found; the T-SQL schema defines 27.', n;
              END IF;

              RAISE NOTICE '% named CHECK constraints present.', n;
          END
          $$;
          SQL

      - name: Assert the six schemas exist
        run: |
          $PSQL -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              missing text;
          BEGIN
              SELECT string_agg(s, ', ')
              INTO missing
              FROM unnest(ARRAY['core','billing','support','analytics','security','ai']) AS s
              WHERE NOT EXISTS (
                  SELECT 1 FROM information_schema.schemata WHERE schema_name = s
              );

              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'Missing schemas: %', missing;
              END IF;

              RAISE NOTICE 'All six schemas present.';
          END
          $$;
          SQL

      - name: Assert public schema is not world-writable
        run: |
          $PSQL -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF has_schema_privilege('public', 'public', 'CREATE') THEN
                  RAISE EXCEPTION
                      'PUBLIC can still CREATE in schema public; 002 did not revoke it.';
              END IF;
              RAISE NOTICE 'schema public is locked down.';
          END
          $$;
          SQL

      - name: Migration coverage summary
        if: always()
        run: |
          {
            echo "### PostgreSQL migration coverage"
            echo
            echo "| script | translated | verified here |"
            echo "|---|---|---|"
            for n in 001 002 003 004 005 006 007 008 009; do
              f=$(ls local-enterprise-copilot/sql/postgres/${n}_*.sql 2>/dev/null | head -1)
              if [ -n "$f" ]; then
                echo "| $n | yes | yes |"
              else
                echo "| $n | **no** | no |"
              fi
            done
            echo
            echo "A script marked **no** has not been translated. Its SQL Server"
            echo "behaviour is not yet reproduced on PostgreSQL, and nothing in"
            echo "this run says otherwise."
          } >> "$GITHUB_STEP_SUMMARY"
