name: CI

# Release gates for the copilot and its cloud deployment tier.
#
# Every job here corresponds to a check that was run by hand during the
# security audit. Encoding them means a regression is caught by the pull
# request rather than by someone remembering to re-run a command.
#
# What this pipeline does NOT prove is deliberately listed in
# SECURITY-DEPLOYMENT-AUDIT.md under "Mandatory live release gates": Azure SQL
# least privilege and RLS, Cloudflare Access JWTs, the Worker-to-backend hop,
# the bge-m3 index, and any end-to-end question. Those need live
# infrastructure and cannot be asserted from CI.

on:
  push:
    branches: [main, cloud-deploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_PROJECT: local-enterprise-copilot
  # The expression that selects the deterministic suite. On a CLEAN install it
  # gives 350 passed, 1 skipped, 54 deselected. The 54 need SQL Server, Ollama
  # or a live Qdrant; the 1 skip is a vanna test guarding itself, since vanna
  # is deliberately not a production dependency.
  #
  # A developer machine with vanna installed reports 351 passed and no skip.
  # The clean number is the honest one, and the difference is exactly why this
  # pipeline installs from scratch.
  DETERMINISTIC: "not integration and not slow and not requires_ollama and not requires_sqlserver"

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint, types, deterministic tests, coverage
  #
  # The matrix covers both ends of the supported range for a reason:
  #   3.12  is what [tool.mypy] targets
  #   3.13  is what the production image runs (python:3.13-slim) and what
  #         requirements.lock.txt was compiled against
  # Testing only one of them would leave the other unexercised, and the one
  # that ships is 3.13.
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: local-enterprise-copilot

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local-enterprise-copilot/pyproject.toml

      - name: Install (clean)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # Mypy is configured for 3.12 and is not a per-interpreter gate.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Deterministic tests
        run: pytest -q -m "${{ env.DETERMINISTIC }}"

      # Coverage runs once, on the mypy interpreter, so the threshold is
      # measured against one number rather than racing two.
      #
      # The floor is 45% while the real figure is 49%. That gap is deliberate:
      # it catches a genuine regression without failing on the few points of
      # drift a refactor produces. It is NOT a claim that 45% is adequate -
      # orchestrator 24%, tracing 27% and retrieval 33% are recorded as a
      # production quality gap in the audit, and raising them is release gate 10.
      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest -q -m "${{ env.DETERMINISTIC }}" \
            --cov=enterprise_copilot \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=45

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: local-enterprise-copilot/coverage.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FastAPI adapter: lint and types
  #
  # cloud/api/ sits outside the copilot package, so neither the project's ruff
  # run (scoped to local-enterprise-copilot/) nor its mypy configuration
  # (packages = ["enterprise_copilot"]) reached it. That left ~1,000 lines of
  # production Python with no static analysis at all. This job closes that gap.
  # ---------------------------------------------------------------------------
  api-static:
    name: API lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local-enterprise-copilot/pyproject.toml

      # The adapter imports enterprise_copilot, so mypy needs the package
      # resolvable. Installing the project is cheaper than stubbing it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "local-enterprise-copilot[dev]"
          pip install fastapi uvicorn

      # Uses cloud/api/ruff.toml, which extends the project rule set with
      # FastAPI's injection callables so B008 stops firing on `Depends(...)`
      # in argument defaults - the documented idiom, not a mutable default.
      - name: Ruff
        run: ruff check cloud/api

      - name: Mypy
        env:
          MYPYPATH: local-enterprise-copilot/src
        run: mypy cloud/api/main.py --python-version 3.12 --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Locked production dependency audit
  #
  # Audits requirements.lock.txt, not pyproject: the lock is what the image
  # installs. Runs on 3.13 because that is the interpreter the lock was
  # compiled for.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: Python production audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit locked production dependencies
        run: pip-audit --requirement cloud/api/requirements.lock.txt

  # ---------------------------------------------------------------------------
  # Cloudflare Worker gateway
  # ---------------------------------------------------------------------------
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Not 20: wrangler >=22.0.0 and vite 8 wants >=22.12.0 on the 22 line.
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Authentication tests
        run: npm test

      # Production dependencies only. Dev-tree advisories are noise for a
      # Worker bundle that ships none of them.
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # React UI for Cloudflare Pages
  # ---------------------------------------------------------------------------
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Not 20: wrangler >=22.0.0 and vite 8 wants >=22.12.0 on the 22 line.
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/ui/package-lock.json

      - name: Install (clean, lockfile-exact)
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this is the type
      # check and the production bundle in one step.
      - name: Type-check and production build
        run: npm run build

      - name: Production audit
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Backend image
  #
  # Build only - nothing is pushed. The Dockerfile installs the Microsoft ODBC
  # driver and the locked dependency set, so this is the first place either can
  # fail. Context is the repository root because the image needs both
  # cloud/api/ and local-enterprise-copilot/; .dockerignore whitelists what
  # actually goes in.
  # ---------------------------------------------------------------------------
  docker:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cloud/api/Dockerfile
          push: false
          load: true
          tags: enterprise-rag-copilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot import the application is a green build that
      # ships a broken container. This catches a missing COPY or a dependency
      # that resolved but does not load.
      - name: Smoke-check the image imports the app
        run: |
          docker run --rm \
            -e BACKEND_TOKEN=ci-smoke-token \
            enterprise-rag-copilot-api:ci \
            python -c "import main; print('FastAPI app imported:', main.app.title)"

  # ---------------------------------------------------------------------------
  # Single required status for branch protection.
  # ---------------------------------------------------------------------------
  gates:
    name: All gates
    runs-on: ubuntu-latest
    needs: [python, api-static, pip-audit, worker, ui, docker]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          echo "python:     ${{ needs.python.result }}"
          echo "api-static: ${{ needs.api-static.result }}"
          echo "pip-audit:  ${{ needs.pip-audit.result }}"
          echo "worker:    ${{ needs.worker.result }}"
          echo "ui:        ${{ needs.ui.result }}"
          echo "docker:    ${{ needs.docker.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more release gates failed."
            exit 1
          fi
