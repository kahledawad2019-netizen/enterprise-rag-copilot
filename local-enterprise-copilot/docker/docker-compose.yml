# Optional services. The application runs fully without these.
#   docker compose -f docker/docker-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: copilot-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: copilot-phoenix
    ports:
      - "6006:6006"   # UI + OTLP HTTP collector
    restart: unless-stopped

volumes:
  qdrant_storage:
