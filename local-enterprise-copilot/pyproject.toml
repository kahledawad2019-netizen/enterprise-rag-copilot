[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-copilot"
version = "0.1.0"
description = "Local Enterprise Intelligence Copilot: document RAG + Text-to-SQL over SQL Server, running entirely on local models."
readme = "README.md"
requires-python = ">=3.11,<3.14"

# ---------------------------------------------------------------------------
# Version strategy
#
# Lower bounds are the versions this project was developed and tested against.
# Upper bounds are set only where an ecosystem has a history of breaking
# changes (vanna, pydantic, sqlglot, qdrant-client). scripts/freeze.ps1 writes
# the exact resolved set to requirements.lock.txt for reproducible installs.
# ---------------------------------------------------------------------------
dependencies = [
    # --- configuration & typed models ---
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    "requests>=2.32,<3",
    "keyring>=25.5",

    # --- SQL Server ---
    "pyodbc>=5.2",
    # --- PostgreSQL / Neon cloud deployment ---
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0.36,<3",
    "sqlglot>=25.0,<31",

    # --- vector store & retrieval ---
    "qdrant-client>=1.12,<2",
    "rank-bm25>=0.2.2",

    # --- local inference ---
    "ollama>=0.4",

    # --- document ingestion ---
    "pypdf>=5.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    # Every document in the corpus carries YAML front matter, which
    # ingestion/parsers.py parses on import. This was undeclared and happened
    # to be present transitively on the original build machine; on a clean
    # install the whole test suite failed to collect. Declared explicitly.
    "PyYAML>=6.0",

    # --- data & analytics ---
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",

    # --- synthetic data ---
    "Faker>=30.0",

    # --- UI ---
    "streamlit>=1.40",

    # --- observability ---
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Cross-encoder reranking. Pulls in PyTorch (~2.5 GB), so it is opt-in.
# Without it the system still runs: the reranker degrades to a no-op and the
# fused hybrid ranking is used directly.
rerank = [
    "sentence-transformers>=3.3",
    "torch>=2.4",
]

# Vanna as the default Text-to-SQL provider. Pinned deliberately: see
# docs/architecture_decisions/ADR-002-vanna-version.md
vanna = [
    "vanna[chromadb,ollama]==2.0.2",
]

# Local trace UI. Entirely optional; the app runs without it.
phoenix = [
    "arize-phoenix>=5.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # tests/test_cloud_api_auth.py covers the backend's authentication and
    # identity-to-persona mapping and imports fastapi. It lived only in
    # cloud/api/requirements.txt, so on a clean install that module failed to
    # COLLECT - meaning the security tests silently did not run at all, while
    # a machine that happened to have fastapi reported them as passing.
    # Declared here so the suite is self-contained.
    "fastapi>=0.115,<1",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a live SQL Server, Ollama or Qdrant",
    "slow: takes more than a few seconds",
    "requires_ollama: needs a running Ollama with the profile models pulled",
    "requires_sqlserver: needs a reachable SQL Server instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Notebooks are executable teaching artefacts and the generated copy is an
# output, not a Python module. Lint their extracted scripts separately when
# editing the curriculum; keep the application release gate focused on code.
exclude = ["notebooks", "data/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
# The release/type-check environment is Python 3.12. Runtime metadata still
# permits 3.11, which should be covered by a separate CI interpreter job.
python_version = "3.12"
packages = ["enterprise_copilot"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "pyodbc",
    "psycopg",
    "psycopg.*",
    "yaml",
    "sentence_transformers",
    "sentence_transformers.*",
    "rank_bm25",
    # Vanna is deliberately absent from the production dependency set (the
    # adapter targets the archived `vanna.legacy` API and is experimental
    # only), so a clean install has nothing for mypy to resolve. Local runs
    # passed solely because a developer happened to have it installed - which
    # is the machine-specific release gate this block exists to prevent.
    "vanna",
    "vanna.*",
]
# These runtime/optional libraries do not all publish compatible type metadata
# across every supported Python version. Keep our code checked while treating
# their boundaries as Any instead of making the release gate machine-specific.
ignore_missing_imports = true
follow_imports = "skip"
